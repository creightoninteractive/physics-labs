<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newton's Second Law Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16;color:#eef3fb;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#lab{position:relative;width:min(100vw,calc(100vh * 1.35),1280px);height:min(100vh,960px)}
@supports(height:100dvh){#lab{width:min(100vw,calc(100dvh * 1.35),1280px);height:min(100dvh,960px)}}
canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
#loading{position:absolute;inset:0;display:flex;gap:14px;flex-direction:column;align-items:center;justify-content:center;background:#090d16;padding:24px;text-align:center}
progress{width:min(320px,80%);accent-color:#60b2c3}
</style>
</head>
<body>
<main id="lab" aria-label="Newton's Second Law interactive physics lab">
<canvas id="unity-canvas" width="1080" height="800" tabindex="0" aria-label="Predict which metal accelerates most, then select Run Experiment. Use Reset to repeat."></canvas>
<div id="loading" role="status" aria-live="polite"><strong>Newton's Second Law Lab</strong><span id="message">Loading the tabletop experiment…</span><progress id="progress" max="1" value="0"></progress></div>
</main>
<script src="Build/WebBuild.loader.js"></script>
<script>
const canvas=document.querySelector("#unity-canvas");
const loading=document.querySelector("#loading");
const message=document.querySelector("#message");
const started=performance.now();
canvas.addEventListener("contextmenu",event=>event.preventDefault());
canvas.addEventListener("pointerdown",()=>canvas.focus({preventScroll:true}));
createUnityInstance(canvas,{
 dataUrl:"Build/WebBuild.data",
 frameworkUrl:"Build/WebBuild.framework.js",
 codeUrl:"Build/WebBuild.wasm",
 streamingAssetsUrl:"StreamingAssets",
 companyName:"DefaultCompany",
 productName:"Newton's Second Law Lab",
 productVersion:"0.1.0",
 devicePixelRatio:1,
 matchWebGLToCanvasSize:true,
 showBanner:(text,type)=>{if(type==="error"){message.textContent=text;loading.style.display="flex";}console[type==="error"?"error":"warn"](text);}
},progress=>{document.querySelector("#progress").value=progress;}).then(instance=>{
 window.unityInstance=instance;
 window.labLoadMilliseconds=Math.round(performance.now()-started);
 loading.style.display="none";
 canvas.focus({preventScroll:true});
}).catch(error=>{message.textContent="Unable to start the lab. "+String(error);console.error(error);});
</script>
</body>
</html>
